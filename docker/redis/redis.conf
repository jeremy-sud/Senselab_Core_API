# Redis Configuration for Ursol CAST API

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
supervised no
loglevel notice

# Persistence
save 900 1
save 300 10
save 60 10000

# RDB
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Limits
maxclients 10000

# Logs
logfile ""
