; PHP-FPM Configuration for Senselab Core API

[www]
user = laravel
group = laravel

listen = 9000

; Process manager
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300s

; Logs
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Environment variables
clear_env = no

; Status page
pm.status_path = /status

; Ping page
ping.path = /ping
ping.response = pong
