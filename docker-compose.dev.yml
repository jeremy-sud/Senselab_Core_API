version: '3.8'

# Docker Compose para Desarrollo
# Incluye herramientas adicionales: PHPMyAdmin, Mailhog

services:
  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    ports:
      - "8000:80"

  php:
    extends:
      file: docker-compose.yml
      service: php
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_MODE=develop,debug
      - XDEBUG_CONFIG=client_host=host.docker.internal

  mysql:
    extends:
      file: docker-compose.yml
      service: mysql
    ports:
      - "3306:3306"

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ursol_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ursol_user
      PMA_PASSWORD: ursol_password
    depends_on:
      - mysql
    networks:
      - ursol_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ursol_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ursol_network

networks:
  ursol_network:
    driver: bridge
