codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**"
  - "database/**"
  - "config/**"
  - "resources/**"
  - "routes/**"
  - "bootstrap/**"
  - "public/**"
  - "storage/**"
  - "vendor/**"
  - "app/Console/**"
  - "app/Providers/**"
