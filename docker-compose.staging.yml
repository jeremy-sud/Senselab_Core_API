version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=staging
    container_name: ursol_php_staging
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
    networks:
      - ursol-staging
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: ursol_nginx_staging
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ursol-staging
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: ursol_mysql_staging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - ursol-mysql-staging-data:/var/lib/mysql
    networks:
      - ursol-staging
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: ursol_redis_staging
    restart: unless-stopped
    networks:
      - ursol-staging

networks:
  ursol-staging:
    driver: bridge

volumes:
  ursol-mysql-staging-data:
    driver: local
