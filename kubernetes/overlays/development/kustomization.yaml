apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: senselab-core-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: senselab-core-api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: senselab-core-queue-worker

configMapGenerator:
  - name: senselab-core-config
    behavior: merge
    literals:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_URL=https://dev-api.senselab.com
      - LOG_LEVEL=debug
      - HACIENDA_ENV=staging
      - HACIENDA_API_URL=https://api-sandbox.comprobanteselectronicos.go.cr
      - HACIENDA_IDP_URL=https://idp-sandbox.comprobanteselectronicos.go.cr
