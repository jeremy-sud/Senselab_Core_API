apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: senselab-core-ingress
  namespace: senselab-core
  labels:
    app.kubernetes.io/name: senselab-core-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - api.senselab.com
      secretName: senselab-core-tls
  rules:
    - host: api.senselab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: senselab-core-api-service
                port:
                  number: 80
