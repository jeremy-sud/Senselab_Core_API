apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ursol-cast-ingress
  namespace: ursol-cast
  labels:
    app.kubernetes.io/name: ursol-cast-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - api.ursol.com
      secretName: ursol-cast-tls
  rules:
    - host: api.ursol.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ursol-cast-api-service
                port:
                  number: 80
