apiVersion: v1
kind: Secret
metadata:
  name: senselab-core-secrets
  namespace: senselab-core
  labels:
    app.kubernetes.io/name: senselab-core-api
type: Opaque
stringData:
  # App Key - CAMBIAR EN PRODUCCIÓN
  APP_KEY: "base64:YOUR_APP_KEY_HERE"
  
  # Database credentials
  DB_USERNAME: "senselab_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password (optional)
  REDIS_PASSWORD: ""
  
  # Hacienda API credentials
  HACIENDA_CLIENT_ID: "YOUR_CLIENT_ID"
  HACIENDA_CLIENT_SECRET: "YOUR_CLIENT_SECRET"
  
  # Sentry DSN (optional)
  SENTRY_LARAVEL_DSN: ""
