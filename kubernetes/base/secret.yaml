apiVersion: v1
kind: Secret
metadata:
  name: ursol-cast-secrets
  namespace: ursol-cast
  labels:
    app.kubernetes.io/name: ursol-cast-api
type: Opaque
stringData:
  # App Key - CAMBIAR EN PRODUCCIÓN
  APP_KEY: "base64:YOUR_APP_KEY_HERE"
  
  # Database credentials
  DB_USERNAME: "ursol_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password (optional)
  REDIS_PASSWORD: ""
  
  # Hacienda API credentials
  HACIENDA_CLIENT_ID: "YOUR_CLIENT_ID"
  HACIENDA_CLIENT_SECRET: "YOUR_CLIENT_SECRET"
  
  # Sentry DSN (optional)
  SENTRY_LARAVEL_DSN: ""
