apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: senselab-core

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - statefulset.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - jobs.yaml

commonLabels:
  app.kubernetes.io/name: senselab-core-api
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize
