apiVersion: v1
kind: ConfigMap
metadata:
  name: senselab-core-config
  namespace: senselab-core
  labels:
    app.kubernetes.io/name: senselab-core-api
data:
  APP_NAME: "Senselab Core API"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://api.senselab.com"
  
  # Database
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "api_db"
  
  # Cache & Session
  CACHE_DRIVER: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Logging
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  
  # Hacienda Costa Rica
  HACIENDA_ENV: "production"
  HACIENDA_API_URL: "https://api.comprobanteselectronicos.go.cr"
  HACIENDA_IDP_URL: "https://idp.comprobanteselectronicos.go.cr"
