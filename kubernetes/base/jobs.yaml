apiVersion: batch/v1
kind: CronJob
metadata:
  name: ursol-cast-scheduler
  namespace: ursol-cast
  labels:
    app.kubernetes.io/name: ursol-cast-api
    app.kubernetes.io/component: scheduler
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: scheduler
              image: ursol-cast-api:latest
              command:
                - php
                - artisan
                - schedule:run
              envFrom:
                - configMapRef:
                    name: ursol-cast-config
                - secretRef:
                    name: ursol-cast-secrets
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          restartPolicy: OnFailure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ursol-cast-queue-worker
  namespace: ursol-cast
  labels:
    app.kubernetes.io/name: ursol-cast-api
    app.kubernetes.io/component: queue-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ursol-cast-api
      app.kubernetes.io/component: queue-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ursol-cast-api
        app.kubernetes.io/component: queue-worker
    spec:
      containers:
        - name: queue-worker
          image: ursol-cast-api:latest
          command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=hacienda,reports,emails,imports,maintenance
            - --sleep=3
            - --tries=3
            - --max-time=3600
          envFrom:
            - configMapRef:
                name: ursol-cast-config
            - secretRef:
                name: ursol-cast-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - php
                - artisan
                - queue:health
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
      terminationGracePeriodSeconds: 60
