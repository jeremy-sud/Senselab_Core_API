<svg xmlns="http://www.w3.org/2000/svg" width="200" height="30" role="img" aria-label="Multi-Tenant: Spatie">
  <title>Multi-Tenant: Spatie</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="200" height="30" rx="5" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="100" height="30" fill="#555"/>
    <rect x="100" width="100" height="30" fill="#E91E63"/>
    <rect width="200" height="30" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="12">
    <text x="50" y="20" fill="#010101" fill-opacity=".3">Multi-Tenant</text>
    <text x="50" y="19">Multi-Tenant</text>
    <text x="150" y="20" fill="#010101" fill-opacity=".3">Spatie Isolated</text>
    <text x="150" y="19">Spatie Isolated</text>
  </g>
</svg>
