sonar.projectKey=ursol-cast-api
sonar.projectName=Ursol CAST API
sonar.projectVersion=1.0.0

# Source
sonar.sources=app
sonar.tests=tests

# Language
sonar.language=php
sonar.php.version=8.2

# Coverage
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/public/**,**/*.blade.php,**/database/migrations/**

# Test exclusions
sonar.test.exclusions=tests/**

# Duplications
sonar.cpd.php.minimumLines=3
sonar.cpd.php.minimumTokens=30

# Quality Gate thresholds
sonar.qualitygate.wait=true

# Code Smells
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore complexity in migrations
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/database/migrations/**

# Ignore unused imports in auto-generated files
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1144
sonar.issue.ignore.multicriteria.e2.resourceKey=**/database/factories/**

# Ignore Eloquent model magic methods
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Models/**
