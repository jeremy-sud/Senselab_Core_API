sonar.projectKey=ursol-cast-api
sonar.projectName=Ursol CAST API
sonar.projectVersion=2.8.0

# Source
sonar.sources=app
sonar.tests=tests

# Language
sonar.language=php
sonar.php.version=8.4

# Coverage
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions - Vendor, storage, cache, etc.
sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/public/**,**/*.blade.php,**/database/migrations/**

# Test exclusions
sonar.test.exclusions=tests/**

# Duplications - Aumentar umbral para evitar falsos positivos en OpenAPI annotations
sonar.cpd.php.minimumLines=10
sonar.cpd.php.minimumTokens=100

# Quality Gate thresholds
sonar.qualitygate.wait=true

# ========================================
# Reglas ignoradas por contexto específico
# ========================================

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# Ignore complexity in migrations
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/database/migrations/**

# Ignore unused imports in auto-generated files
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1144
sonar.issue.ignore.multicriteria.e2.resourceKey=**/database/factories/**

# Ignore Eloquent model magic methods
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Models/**

# S1192: Ignore string duplication in Controllers (OpenAPI annotations use repeated literals)
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e4.resourceKey=**/Controllers/**

# S1192: Ignore string duplication in routes file (HTTP paths are inherently repeated)
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e5.resourceKey=**/routes/**

# S138: Ignore function length in routes file (Laravel convention for route definitions)
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S138
sonar.issue.ignore.multicriteria.e6.resourceKey=**/routes/**

